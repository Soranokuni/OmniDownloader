[workspace]
members = [
    "crates/omni-core",
    "crates/omni-broadcast",
    "crates/omni-browser",
    "crates/omni-email",
    "crates/omni-web",
    "crates/omni-service",
    "crates/omni-cli",
]
resolver = "2"

[package]
name = "omni-ingest"
version = "1.0.0"
edition = "2021"
authors = ["Alex Fountas"]
description = "Unified Broadcast-Grade Media Ingest Engine & Windows Service"

[dependencies]
omni-core = { path = "crates/omni-core" }
omni-broadcast = { path = "crates/omni-broadcast" }
omni-browser = { path = "crates/omni-browser" }
omni-email = { path = "crates/omni-email" }
omni-web = { path = "crates/omni-web" }
omni-service = { path = "crates/omni-service" }
omni-cli = { path = "crates/omni-cli" }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
metrics-exporter-prometheus = { version = "0.18", default-features = false }


# The recipe interpreter parses whole pages; keep the HTML and regex engines
# fast in debug test runs so the per-recipe time budget is meaningful.
[profile.dev.package.html5ever]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.scraper]
opt-level = 3
[profile.dev.package.markup5ever]
opt-level = 3
[profile.dev.package.tendril]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
