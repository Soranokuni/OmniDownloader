[package]
name = "omni-email"
version = "1.0.0"
edition = "2021"

[dependencies]
omni-core = { path = "../omni-core" }
mailparse = "0.15"
encoding_rs = "0.8"
reqwest = { version = "0.12", features = ["json", "stream"] }
regex = "1.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
rusqlite = "0.32"
axum = "0.7"
