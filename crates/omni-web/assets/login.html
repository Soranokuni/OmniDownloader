<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDownloader - Broadcast Ingest Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(18, 20, 29, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="glass w-full max-w-md p-8 rounded-2xl shadow-2xl shadow-cyan-950/30 space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex w-12 h-12 rounded-xl bg-cyan-500 items-center justify-center text-slate-950 font-black text-2xl shadow-lg shadow-cyan-500/20 mb-2">
                O
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white">OmniDownloader Ingest</h1>
            <p class="text-xs text-slate-400">Broadcast Control & Newsroom Delivery System</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="email">Work Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                    <input type="email" id="email" required placeholder="reporter@newsroom.local"
                        class="w-full bg-slate-900/80 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5" for="password">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full bg-slate-900/80 border border-slate-800 rounded-lg pl-9 pr-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors">
                </div>
            </div>

            <button type="submit"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 px-4 rounded-lg text-sm transition-all shadow-lg shadow-cyan-500/10 flex items-center justify-center space-x-2">
                <span>Sign In to Portal</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div id="login-error" class="hidden text-xs bg-rose-500/10 border border-rose-500/20 text-rose-400 p-3 rounded-lg text-center font-medium"></div>

        <div class="pt-2 text-center border-t border-slate-900 flex justify-between items-center text-xs text-slate-500">
            <a href="/mcr" class="hover:text-cyan-400 transition-colors flex items-center space-x-1">
                <i data-lucide="monitor" class="w-3.5 h-3.5"></i>
                <span>Open MCR Watcher</span>
            </a>
            <span>Dalet Ingest XDCAM</span>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    if (data.role === 'admin') {
                        window.location.href = '/admin';
                    } else if (data.role === 'open_mcr') {
                        window.location.href = '/mcr';
                    } else {
                        window.location.href = '/user';
                    }
                } else {
                    errDiv.innerText = data.error || 'Invalid email or password';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'Network error contacting server.';
                errDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
