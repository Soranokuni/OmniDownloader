<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDownloader — Sign in</title>
<link rel="stylesheet" href="/static/app.css?v=2">
<link rel="icon" href="data:,">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <div class="brand-mark">O</div>
      <h1>OmniDownloader</h1>
      <p>Broadcast ingest — newsroom sign in</p>
    </div>

    <div class="card">
      <form id="login-form" class="stack">
        <div>
          <label for="email">Work email</label>
          <input type="email" id="email" required autocomplete="username" autofocus>
        </div>
        <div>
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Sign in</button>
        <p id="error" class="note bad" role="alert"></p>
      </form>
    </div>

    <p id="setup-hint" class="note" style="text-align:center;margin-top:14px" hidden>
      No administrator account exists yet. Open
      <strong>/setup</strong> in a browser on the ingest machine itself to create one.
    </p>
  </div>
</div>

<script type="module" src="/static/login.js?v=3"></script>
</body>
</html>
