<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDownloader — MCR</title>
<link rel="stylesheet" href="/static/app.css?v=12">
<link rel="stylesheet" href="/static/status.css?v=11">
<link rel="icon" href="data:,">
</head>
<body class="desk-page">

<!-- The control-room header (plan P12.5): the product, one health pill that
     opens every line of the system's health, sound and account. One line at 1366 px.
     Every word on this page comes from text.el.js by key (data-t, P12.7, P12.10). -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">O</div>
      <div>
        <h1>OmniDownloader</h1>
        <p data-t="page.tagline"></p>
      </div>
    </div>
    <div class="topbar-status">
      <button class="health-pill" type="button" id="health-pill" aria-expanded="false" aria-controls="health-panel">
        <span id="health-dot" class="dot" aria-hidden="true"></span><span id="health-text" data-t="health.pill.checking"></span>
      </button>
      <span id="sound-slot" class="sound-slot"></span>
      <a class="btn" href="/admin" data-t="page.admin"></a>
      <button class="btn" type="button" id="logout-btn" data-t="page.logout"></button>
    </div>
  </div>
  <!-- Every health line, free space and what to do; filled by mcr.js. -->
  <section id="health-panel" class="health-panel" data-t-aria-label="page.health_panel" hidden></section>
</header>

<main>
  <!-- Filled by the status poll when a subsystem check is not OK. -->
  <!-- Shown by the status poll when the service stops answering. -->
  <div id="offline-banner" role="alert" hidden></div>
  <div id="health-banner" hidden></div>
  <div id="selfheal-lines" hidden></div>

  <!-- Videos that are late and why; filled by mcr.js, hidden when none (P11.3b). -->
  <section id="late-strip" class="late-strip" data-t-aria-label="late.title" hidden></section>

  <!-- Only the desk's work in the tabs (P12.10): adding a link is a side panel,
       the broadcast specification and the shortcuts are under «Βοήθεια», and
       the journalists are edited on the administration page. -->
  <div class="tabs">
  <div role="tablist" class="tablist">
    <button class="tab" type="button" role="tab" id="tabbtn-email" data-tab="email" aria-controls="tab-email" aria-selected="true" tabindex="0">
      <span data-t="tab.email"></span> <span id="email-count" class="badge info" hidden>0</span>
    </button>
    <button class="tab" type="button" role="tab" id="tabbtn-queue" data-tab="queue" aria-controls="tab-queue" aria-selected="false" tabindex="-1">
      <span data-t="tab.queue"></span> <span id="queue-count" class="badge info" hidden>0</span>
    </button>
    <button class="tab" type="button" role="tab" id="tabbtn-review" data-tab="review" aria-controls="tab-review" aria-selected="false" tabindex="-1">
      <span data-t="tab.review"></span> <span id="review-count" class="badge warn" hidden>0</span>
    </button>
    <button class="tab" type="button" role="tab" id="tabbtn-completed" data-tab="completed" aria-controls="tab-completed" aria-selected="false" tabindex="-1">
      <span data-t="tab.completed"></span> <span id="completed-count" class="badge" hidden>0</span>
    </button>
  </div>
    <div class="tab-end tab-actions">
      <button class="btn btn-primary" type="button" id="add-btn" aria-expanded="false" aria-controls="add-panel" data-t="add.button"></button>
      <div class="menu-wrap">
        <button class="btn" type="button" id="help-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="help-menu" data-t="help.button"></button>
        <div id="help-menu" class="menu" role="menu" data-t-aria-label="help.button" hidden>
          <button class="menu-item" type="button" role="menuitem" id="help-specs" tabindex="-1" data-t="tab.specs"></button>
          <button class="menu-item" type="button" role="menuitem" id="help-keys" tabindex="-1" data-t="keys.title"></button>
          <!-- The wall board (P12.13), in a tab of its own for the control-room monitor. -->
          <a class="menu-item" role="menuitem" id="help-board" tabindex="-1" href="/board" target="_blank" rel="noopener" data-t="help.board"></a>
        </div>
      </div>
    </div>
  </div>

  <!-- Every mail and every link added by hand, each with its videos (plan P7.10) -->
  <section id="tab-email" class="stack" role="tabpanel" aria-labelledby="tabbtn-email">
    <div class="ib-toolbar">
      <div class="ib-filters" id="inbox-filters" role="group" data-t-aria-label="inbox.filter.label"></div>
      <input type="search" id="inbox-search" data-t-placeholder="inbox.search" data-t-aria-label="search.label">
    </div>
    <p class="note flat" data-t="inbox.intro"></p>
    <div id="inbox-list" class="ib-list">
      <div class="card center" data-t="loading"></div>
    </div>
    <div id="inbox-pager"></div>
  </section>

  <!-- Live queue -->
  <section id="tab-queue" class="stack" role="tabpanel" aria-labelledby="tabbtn-queue" hidden>
    <div class="section-head">
      <p class="note flat" data-t="queue.intro"></p>
      <button class="btn" type="button" id="clear-finished" disabled data-t="queue.clear"></button>
    </div>
    <!-- Other videos found in submitted articles, for MCR to queue (empty when none) -->
    <div id="article-offers" class="stack"></div>
    <div id="queue-cards" class="stack">
      <div class="card center" data-t="loading"></div>
    </div>
    <div id="queue-pager"></div>
  </section>

  <!-- Needs attention -->
  <section id="tab-review" class="stack" role="tabpanel" aria-labelledby="tabbtn-review" hidden>
    <!-- Videos made and held until MCR approves them (plan P10.7); hidden when none.
         approval.js writes the title with its count. -->
    <div id="approval-section" class="stack" hidden>
      <h2 class="ap-title"></h2>
      <p class="note flat" data-t="approval.intro"></p>
      <div class="ap-list stack"></div>
    </div>
    <p class="note flat" data-t="review.intro"></p>
    <div class="card">
      <div class="section-head">
        <div class="row">
          <label for="review-journalist" class="inline-label" data-t="filter.journalist"></label>
          <select id="review-journalist" class="auto"><option value="" data-t="filter.all_journalists"></option></select>
        </div>
        <input type="search" id="review-search" class="search-wide" data-t-placeholder="search.files" data-t-aria-label="search.label">
      </div>
      <div class="section-head spaced-top">
        <button class="btn" type="button" id="hide-old-review" data-t="review.hide_old"></button>
        <label id="review-hidden-label" class="row inline-check" hidden>
          <input type="checkbox" id="review-show-hidden" class="auto">
          <span id="review-hidden-text"></span>
        </label>
      </div>
    </div>
    <div id="review-cards" class="stack">
      <div class="card center" data-t="loading"></div>
    </div>
    <div id="review-pager"></div>
  </section>

  <!-- Completed -->
  <section id="tab-completed" class="stack" role="tabpanel" aria-labelledby="tabbtn-completed" hidden>
    <div class="card">
      <div class="section-head">
        <div class="row">
          <label for="journalist-filter" class="inline-label" data-t="filter.journalist"></label>
          <select id="journalist-filter" class="auto"><option value="" data-t="filter.all_journalists"></option></select>
          <label for="group-filter" class="inline-label spaced" data-t="filter.group"></label>
          <select id="group-filter" class="auto"><option value="" data-t="filter.all_groups"></option></select>
        </div>
        <input type="search" id="completed-search" class="search-wide" data-t-placeholder="search.files" data-t-aria-label="search.label">
      </div>
      <p class="note flat spaced-top" data-t="completed.intro"></p>
    </div>
    <div id="completed-offers" class="stack"></div>
    <div class="card flush">
      <table>
        <thead>
          <tr>
            <th data-t="completed.col.file"></th><th data-t="filter.journalist"></th><th data-t="filter.group"></th>
            <th data-t="completed.col.delivered"></th><th data-t="completed.col.length"></th><th class="right"></th>
          </tr>
        </thead>
        <tbody id="completed-body">
          <tr><td colspan="6" class="empty" data-t="loading"></td></tr>
        </tbody>
      </table>
    </div>
    <div id="completed-pager"></div>
  </section>
</main>

<!-- Add a link by hand (P12.10): a side panel over the right of the desk, so
     the list being worked on stays in view. Escape or «Κλείσιμο» closes it. -->
<aside id="add-panel" class="side-panel" role="dialog" aria-modal="false" aria-labelledby="add-title" hidden>
  <div class="section-head side-head">
    <h2 id="add-title" class="card-title bare" data-t="add.title"></h2>
    <button class="btn btn-icon" type="button" id="add-close" data-t-aria-label="page.close">✕</button>
  </div>
  <p class="note form-intro" data-t="add.intro"></p>
  <form id="manual-form" class="stack">
    <div>
      <label for="m-url" data-t="add.url"></label>
      <input type="url" id="m-url" required placeholder="https://…">
    </div>
    <div>
      <label for="m-journalist" data-t="add.journalist"></label>
      <input type="text" id="m-journalist" required placeholder="PAPADAKI" list="m-journalists">
      <datalist id="m-journalists"></datalist>
    </div>
    <div>
      <label for="m-keyword" data-t="add.keyword"></label>
      <input type="text" id="m-keyword" required placeholder="SEISMOS">
    </div>
    <div class="grid-2">
      <div>
        <label for="m-index" data-t="add.index"></label>
        <input type="text" id="m-index" value="1" required maxlength="9">
      </div>
      <div>
        <label for="m-max" data-t="add.max"></label>
        <input type="number" id="m-max" min="1" max="20" data-t-placeholder="add.max.placeholder">
      </div>
    </div>
    <div class="checkbox-row">
      <input type="checkbox" id="m-priority">
      <label for="m-priority" data-t="add.urgent"></label>
    </div>
    <p class="note flat mono" id="m-preview" aria-live="polite"></p>
    <button class="btn btn-primary btn-block" type="submit" data-t="add.submit"></button>
  </form>
</aside>

<script type="module" src="/static/mcr.js?v=60"></script>
</body>
</html>
