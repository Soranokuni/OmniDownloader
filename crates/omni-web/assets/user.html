<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="user.page.title">OmniDownloader</title>
<link rel="stylesheet" href="/static/app.css?v=12">
<link rel="stylesheet" href="/static/status.css?v=12">
<link rel="icon" href="data:,">
</head>
<body>

<!-- Every word on this page comes from text.el.js by key (data-t, P12.10). -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div>
        <h1>OmniDownloader</h1>
        <p data-t="user.page.tagline"></p>
      </div>
    </div>
    <div class="topbar-status">
      <span id="user-display" class="status-item" data-t="user.page.signed_in"></span>
      <button class="btn" type="button" id="password-btn" data-t="user.page.password"></button>
      <button class="btn" type="button" id="logout-btn" data-t="page.logout"></button>
    </div>
  </div>
</header>

<main class="stack">

  <section class="card">
    <h2 class="card-title" data-t="user.page.send_title"></h2>
    <form id="submit-form" class="stack">
      <div class="checkbox-row">
        <input type="checkbox" id="multi">
        <label for="multi" data-t="user.page.multi"></label>
      </div>
      <div id="single-box">
        <label for="url" data-t="user.page.url"></label>
        <input type="url" id="url" required data-t-placeholder="user.page.url.placeholder">
      </div>
      <div id="multi-box" hidden>
        <label for="urls" data-t="user.page.urls"></label>
        <textarea id="urls" rows="6" placeholder="https://…&#10;https://…" aria-describedby="urls-count"></textarea>
        <p class="note flat links-count" id="urls-count" aria-live="polite"></p>
      </div>
      <div class="grid-2">
        <div>
          <label for="keyword" data-t="user.page.keyword"></label>
          <input type="text" id="keyword" required data-t-placeholder="user.page.keyword.placeholder">
        </div>
        <div>
          <label for="index" data-t="user.page.index"></label>
          <input type="text" id="index" value="1" required maxlength="9">
        </div>
      </div>
      <div>
        <label for="notes" data-t="user.page.notes"></label>
        <input type="text" id="notes" data-t-placeholder="user.page.notes.placeholder">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="priority">
        <label for="priority" data-t="add.urgent"></label>
      </div>
      <!-- The file name the video will get (P12.11), from the server's compose. -->
      <p class="note flat mono" id="slug-preview" aria-live="polite"></p>
      <button class="btn btn-primary btn-block" type="submit" data-t="user.page.send"></button>
      <div id="submit-result" class="stack"></div>
    </form>
  </section>

  <section class="card">
    <div class="checkbox-row">
      <input type="checkbox" id="notify">
      <label for="notify" data-t="user.page.notify"></label>
    </div>
  </section>

  <section class="stack">
    <!-- The list follows the server by itself; no «Ανανέωση» button (P12.12). -->
    <div class="section-head">
      <h2 class="card-title bare" data-t="user.page.mine"></h2>
    </div>
    <div id="my-jobs" class="stack">
      <div class="card center" data-t="loading"></div>
    </div>
  </section>

</main>

<div class="modal" id="password-modal" hidden>
  <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <h2 id="pw-title" class="card-title" data-t="user.page.password"></h2>
    <form id="password-form" class="stack">
      <div>
        <label for="pw-current" data-t="user.page.pw_current"></label>
        <input type="password" id="pw-current" required autocomplete="current-password">
      </div>
      <div>
        <label for="pw-new" data-t="user.page.pw_new"></label>
        <input type="password" id="pw-new" required minlength="12" autocomplete="new-password">
      </div>
      <p class="note" data-t="user.page.pw_note"></p>
      <div class="row">
        <button class="btn btn-primary grow" type="submit" data-t="user.page.password"></button>
        <button class="btn" type="button" id="pw-cancel" data-t="dialog.cancel"></button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/static/user.js?v=21"></script>
</body>
</html>
