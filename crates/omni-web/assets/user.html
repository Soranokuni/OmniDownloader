<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDownloader - Journalist Ingest Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(18, 20, 29, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">
    <!-- Header -->
    <header class="border-b border-slate-900 bg-slate-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-cyan-500 flex items-center justify-center text-slate-950 font-bold text-lg shadow-lg shadow-cyan-500/20">
                    O
                </div>
                <div>
                    <h1 class="text-md font-bold tracking-tight text-white">OmniDownloader</h1>
                    <p class="text-[10px] text-slate-400 tracking-wider uppercase font-semibold">Newsroom Ingest Desk</p>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <span id="user-display" class="text-xs text-slate-300 font-medium">Logged in</span>
                <button onclick="logout()" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white border border-slate-800 transition-colors flex items-center space-x-1.5">
                    <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto px-6 py-8 w-full space-y-8">
        <!-- Ingestion Form Card -->
        <section class="glass p-6 rounded-2xl space-y-5 border border-slate-900">
            <div class="flex items-center space-x-2 border-b border-slate-900 pb-3">
                <i data-lucide="plus-circle" class="text-cyan-400 w-5 h-5"></i>
                <h2 class="text-sm font-bold tracking-wider uppercase text-slate-200">Submit Video for Ingest</h2>
            </div>

            <form id="submit-job-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" for="url">Video Link / Article URL</label>
                    <input class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors"
                        type="url" id="url" required placeholder="https://www.youtube.com/watch?v=... or news portal article URL">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" for="keyword">Topic / Distinctive Keyword</label>
                    <input class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors"
                        type="text" id="keyword" required placeholder="e.g. KNICKS or PROTEST">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1.5" for="notes">Notes for MCR (Optional)</label>
                    <input class="w-full bg-slate-900/80 border border-slate-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-500 transition-colors"
                        type="text" id="notes" placeholder="e.g. ΓΙΑ ΠΛΑΝΑ: focus on second interview">
                </div>

                <div class="flex items-center space-x-2 py-2">
                    <input class="w-4 h-4 rounded text-cyan-500 bg-slate-900 border-slate-800 focus:ring-0"
                        type="checkbox" id="priority">
                    <label class="text-xs font-semibold text-slate-300" for="priority">High Priority / Breaking News</label>
                </div>

                <div class="flex justify-end">
                    <button type="submit"
                        class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2 px-6 rounded-lg text-sm transition-all shadow-lg shadow-cyan-500/10 flex items-center space-x-2">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Ingest Media</span>
                    </button>
                </div>
            </form>
            <div id="toast" class="hidden text-xs rounded-lg p-3 font-semibold"></div>
        </section>

        <!-- User Submissions Tracker -->
        <section class="space-y-4">
            <div class="flex items-center justify-between border-b border-slate-900 pb-3">
                <div class="flex items-center space-x-2">
                    <i data-lucide="history" class="text-cyan-400 w-5 h-5"></i>
                    <h2 class="text-sm font-bold tracking-wider uppercase text-slate-200">My Ingested Items</h2>
                </div>
                <div class="text-[11px] text-slate-500 font-medium">Real-time status updates</div>
            </div>

            <div id="user-jobs-list" class="grid grid-cols-1 gap-4">
                <div class="glass p-6 text-center text-slate-500 rounded-xl">
                    <p>Loading your ingest history...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-900 bg-slate-950 py-4 mt-12">
        <div class="max-w-6xl mx-auto px-6 text-center text-[10px] text-slate-600 uppercase tracking-wider font-semibold">
            OmniDownloader Broadcast Delivery Platform &copy; 2026. Standardized MXF Delivery (Sony XDCAM HD422 PAL 1080i50).
        </div>
    </footer>

    <script>
        lucide.createIcons();
        let currentUser = null;

        async function init() {
            try {
                const res = await fetch('/api/auth/me');
                if (!res.ok) { window.location.href = '/login'; return; }
                currentUser = await res.json();
                document.getElementById('user-display').innerText = `${currentUser.full_name} (${currentUser.journalist_surname || currentUser.email})`;
                fetchMyJobs();
                setupSSE();
            } catch (e) {
                window.location.href = '/login';
            }
        }

        async function fetchMyJobs() {
            try {
                const res = await fetch('/api/jobs?my=true');
                if (res.ok) {
                    const data = await res.json();
                    renderJobs(data.jobs || []);
                }
            } catch (err) {
                console.error("Failed fetching jobs:", err);
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('user-jobs-list');
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="glass p-8 text-center text-slate-500 rounded-xl">
                        <i data-lucide="inbox" class="w-8 h-8 mx-auto mb-2 text-slate-600"></i>
                        <p class="text-sm">You haven't submitted any videos yet. Paste a video URL above to begin.</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            container.innerHTML = jobs.map(j => {
                let badgeClass = "bg-slate-800/60 text-slate-400 border-slate-700";
                if (j.status === 'COMPLETED') badgeClass = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                else if (j.status === 'DOWNLOADING') badgeClass = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                else if (j.status === 'TRANSCODING' || j.status === 'REWRAPPING') badgeClass = "bg-purple-500/10 text-purple-400 border-purple-500/20";
                else if (j.status === 'REQUIRES_REVIEW' || j.status === 'MANUAL_DOWNLOAD') badgeClass = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                else if (j.status === 'FAILED') badgeClass = "bg-rose-500/10 text-rose-400 border-rose-500/20";

                return `
                    <div class="glass p-5 rounded-xl border border-slate-900 space-y-3">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="text-sm font-bold text-white">${j.slug}.mxf</h3>
                                <p class="text-[11px] text-slate-400 code-font truncate max-w-md" title="${j.url}">${j.url}</p>
                            </div>
                            <span class="px-2.5 py-1 rounded-md text-[10px] font-bold uppercase tracking-wider border ${badgeClass}">
                                ${j.status === 'COMPLETED' ? 'READY IN DALET' : j.status}
                            </span>
                        </div>

                        ${j.status !== 'COMPLETED' && j.status !== 'FAILED' ? `
                            <div class="space-y-1">
                                <div class="flex justify-between text-[10px] text-slate-400">
                                    <span>${j.status}...</span>
                                    <span>${j.progress.toFixed(1)}%</span>
                                </div>
                                <div class="w-full bg-slate-950 rounded-full h-2 overflow-hidden border border-slate-900">
                                    <div class="bg-gradient-to-r from-cyan-400 to-indigo-500 h-2 rounded-full transition-all duration-300" style="width: ${j.progress}%"></div>
                                </div>
                            </div>
                        ` : ''}

                        ${j.status === 'COMPLETED' ? `
                            <div class="bg-emerald-950/30 border border-emerald-500/20 p-2.5 rounded-lg text-xs text-emerald-300 flex items-center space-x-2">
                                <i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i>
                                <span>Delivered to Dalet Galaxy as <strong class="code-font text-white">${j.slug}.mxf</strong></span>
                            </div>
                        ` : ''}

                        ${j.notes ? `<div class="text-[11px] text-slate-400 italic">Notes: ${j.notes}</div>` : ''}
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        document.getElementById('submit-job-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const keyword = document.getElementById('keyword').value.trim();
            const notes = document.getElementById('notes').value.trim();
            const priority = document.getElementById('priority').checked ? 10 : 0;

            try {
                const res = await fetch('/api/jobs', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, keyword, notes, priority })
                });
                const toast = document.getElementById('toast');
                if (res.ok) {
                    toast.innerText = 'Video successfully enqueued for ingest!';
                    toast.className = 'text-xs rounded-lg p-3 font-semibold bg-emerald-500/10 border border-emerald-500/20 text-emerald-400';
                    toast.classList.remove('hidden');
                    document.getElementById('submit-job-form').reset();
                    fetchMyJobs();
                    setTimeout(() => toast.classList.add('hidden'), 4000);
                } else {
                    const err = await res.json();
                    toast.innerText = 'Error: ' + err.error;
                    toast.className = 'text-xs rounded-lg p-3 font-semibold bg-rose-500/10 border border-rose-500/20 text-rose-400';
                    toast.classList.remove('hidden');
                }
            } catch (err) {
                alert('Network error submitting job.');
            }
        });

        function setupSSE() {
            const eventSource = new EventSource('/api/events');
            eventSource.onmessage = (event) => {
                fetchMyJobs();
            };
        }

        async function logout() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        init();
    </script>
</body>
</html>
