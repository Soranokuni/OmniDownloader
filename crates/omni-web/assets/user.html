<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDownloader — Journalist Ingest Portal</title>
<link rel="stylesheet" href="/static/app.css?v=2">
<link rel="icon" href="data:,">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div>
        <h1>OmniDownloader</h1>
        <p>Newsroom Ingest Desk</p>
      </div>
    </div>
    <div class="topbar-status">
      <span id="user-display" class="status-item">Signed in</span>
      <button class="btn" type="button" id="password-btn">Change password</button>
      <button class="btn" type="button" id="logout-btn">Sign out</button>
    </div>
  </div>
</header>

<main class="stack">

  <section class="card">
    <h2 class="card-title">Submit a video for ingest</h2>
    <form id="submit-form" class="stack">
      <div>
        <label for="url">Video link or article URL</label>
        <input type="url" id="url" required
               placeholder="https://www.youtube.com/watch?v=… or a news portal article">
      </div>
      <div class="grid-2">
        <div>
          <label for="keyword">Topic / distinctive keyword</label>
          <input type="text" id="keyword" required placeholder="KNICKS, PROTEST, …">
        </div>
        <div>
          <label for="index">Section number in your rundown</label>
          <input type="text" id="index" value="1" required>
        </div>
      </div>
      <div>
        <label for="notes">Notes for MCR (optional)</label>
        <input type="text" id="notes" placeholder="e.g. only the second half of the clip">
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="priority">
        <label for="priority">Urgent — put ahead of the queue</label>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Send to ingest</button>
    </form>
  </section>

  <section class="stack">
    <div class="section-head">
      <h2 class="card-title" style="border:none;margin:0;padding:0">My submissions</h2>
      <button class="btn" type="button" id="refresh-btn">Refresh</button>
    </div>
    <div id="my-jobs" class="stack">
      <div class="card center">Loading your submissions…</div>
    </div>
  </section>

</main>

<div class="modal" id="password-modal" hidden>
  <div class="modal-body" role="dialog" aria-modal="true" aria-labelledby="pw-title">
    <h2 id="pw-title" class="card-title">Change your password</h2>
    <form id="password-form" class="stack">
      <div>
        <label for="pw-current">Current password</label>
        <input type="password" id="pw-current" required autocomplete="current-password">
      </div>
      <div>
        <label for="pw-new">New password (at least 12 characters)</label>
        <input type="password" id="pw-new" required minlength="12" autocomplete="new-password">
      </div>
      <p class="note">Changing your password signs you out on every device.</p>
      <div class="row">
        <button class="btn btn-primary grow" type="submit">Change password</button>
        <button class="btn" type="button" id="pw-cancel">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script type="module" src="/static/user.js?v=3"></script>
</body>
</html>
