<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-t="admin.page.title">OmniDownloader</title>
<link rel="stylesheet" href="/static/app.css?v=12">
<link rel="icon" href="data:,">
<style>
  .admin-layout { display:grid; grid-template-columns: 220px 1fr; gap:20px; align-items:start; }
  .admin-nav { position:sticky; top:16px; display:flex; flex-direction:column; gap:6px; }
  .admin-nav a { display:block; padding:8px 12px; border-radius:8px; text-decoration:none; color:inherit; }
  .admin-nav a.active { background:rgba(251,113,133,0.15); font-weight:600; }
  .admin-section { display:flex; flex-direction:column; gap:16px; min-width:0; }
  @media (max-width: 900px) { .admin-layout { grid-template-columns: 1fr; } .admin-nav { position:static; } }
</style>
</head>
<body>
<!-- P13.6: the words of the shell, the Overview and the Settings come from
     admin-text.el.js / admin-text.en.js by key (data-t); Greek by default. -->

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark" style="background:#fb7185;color:#1a0409">A</div>
      <div>
        <h1>OmniDownloader</h1>
        <p style="color:#fb7185" data-t="admin.page.tagline"></p>
      </div>
    </div>
    <div class="topbar-status">
      <button class="btn" type="button" id="lang-btn" lang="en"></button>
      <a class="btn" href="/mcr" data-t="admin.page.desk"></a>
      <button class="btn btn-danger" type="button" id="logout-btn" data-t="admin.page.logout"></button>
    </div>
  </div>
</header>

<main class="admin-layout">

  <nav class="admin-nav card" data-t-aria-label="admin.nav.label">
    <input type="search" id="admin-search" data-t-placeholder="admin.search.placeholder" data-t-aria-label="admin.search.label" autocomplete="off">
    <p class="note" id="admin-search-note" role="status" style="margin:0"></p>
    <a href="#overview" data-nav="overview" data-t="admin.nav.overview"></a>
    <a href="#settings" data-nav="settings" data-t="admin.nav.settings"></a>
    <a href="#people" data-nav="people" data-t="admin.nav.people"></a>
    <a href="#sites" data-nav="sites" data-t="admin.nav.sites"></a>
    <a href="#maintenance" data-nav="maintenance" data-t="admin.nav.maintenance"></a>
  </nav>

  <div>
  <!-- Επισκόπηση -->
  <div class="admin-section" data-section="overview" hidden>
    <section class="card stack" id="needs">
      <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.needs.title"></h2>
      <div id="needs-list" class="stack"><p class="note" data-t="admin.loading"></p></div>
    </section>
    <section class="card stack" id="health">
      <div class="section-head">
        <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.health.title"></h2>
        <button class="btn" type="button" id="health-refresh" data-t="admin.refresh"></button>
      </div>
      <div id="health-list" class="stack"><p class="note" data-t="admin.loading"></p></div>
    </section>
    <section class="card stack" id="autonomy">
      <div class="section-head">
        <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.autonomy.title"></h2>
        <div class="row tight">
          <select id="autonomy-days" data-t-aria-label="admin.autonomy.period">
            <option value="7" data-t="admin.autonomy.days7"></option>
            <option value="14" selected data-t="admin.autonomy.days14"></option>
            <option value="30" data-t="admin.autonomy.days30"></option>
          </select>
          <button class="btn" type="button" id="autonomy-refresh" data-t="admin.refresh"></button>
        </div>
      </div>
      <p class="note" data-t="admin.autonomy.intro"></p>
      <div id="autonomy-figures" class="stack"><p class="note" data-t="admin.loading"></p></div>
      <div id="autonomy-tables" class="stack"></div>
    </section>
    <section class="card stack" id="repair-shadow">
      <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.shadow.title"></h2>
      <p class="note" data-t="admin.shadow.intro"></p>
      <div id="shadow-body" class="stack"><p class="note" data-t="admin.loading"></p></div>
    </section>
  </div>

  <!-- Ρυθμίσεις -->
  <div class="admin-section" data-section="settings" hidden>
    <section class="card" id="setup-card">
      <h2 class="card-title" data-t="admin.setup.title"></h2>
      <p class="note" id="setup-state" style="margin-bottom:10px" data-t="admin.setup.checking"></p>
      <button class="btn btn-block" type="button" id="setup-rerun" data-t="admin.setup.rerun"></button>
      <p class="note" style="margin-top:8px" data-t="admin.setup.about"></p>
      <p class="note warn" id="watchfolder-pending" hidden></p>
      <div id="restart-box" hidden style="margin-top:12px">
        <p class="note" data-t="admin.restart.about"></p>
        <p class="note warn" id="restart-warn" hidden data-t="admin.restart.warn"></p>
        <button class="btn btn-block" type="button" id="restart-btn" data-t="admin.restart.button"></button>
        <p class="note" id="restart-result" role="status"></p>
      </div>
    </section>
    <section class="card stack" id="watchfolder" data-keywords="watchfolder φάκελος παράδοσης">
      <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.wf.title"></h2>
      <label for="wf-path" data-t="admin.wf.path"></label>
      <input type="text" id="wf-path" autocomplete="off" spellcheck="false">
      <p class="note" id="wf-in-use"></p>
      <div class="row">
        <button class="btn" type="button" id="wf-test" data-t="admin.test"></button>
        <button class="btn btn-primary" type="button" id="wf-save" disabled data-t="admin.save"></button>
      </div>
      <p class="note" data-t="admin.wf.about"></p>
      <p id="wf-result" class="note" style="white-space:pre-line"></p>
    </section>
    <section class="card" data-keywords="mailbox graph entra tenant client secret">
      <h2 class="card-title" data-t="admin.mail.title"></h2>
      <div>
        <div>
          <label for="test-mail-tenant" data-t="admin.mail.tenant"></label>
          <input type="text" id="test-mail-tenant" autocomplete="off" spellcheck="false">
          <label for="test-mail-client" style="margin-top:8px" data-t="admin.mail.client"></label>
          <input type="text" id="test-mail-client" autocomplete="off" spellcheck="false">
          <label for="test-mail-user" style="margin-top:8px" data-t="admin.mail.mailbox"></label>
          <input type="text" id="test-mail-user" placeholder="ingest@station.gr">
          <label for="test-mail-secret" style="margin-top:8px" data-t="admin.mail.secret"></label>
          <input type="password" id="test-mail-secret" autocomplete="off">
          <label for="test-mail-expires" style="margin-top:8px" data-t="admin.mail.expires"></label>
          <input type="date" id="test-mail-expires">
          <p class="note" style="margin:4px 0 0" data-t="admin.mail.expires_help"></p>
          <div class="row" style="margin-top:10px">
            <button class="btn" type="button" id="test-mail-btn" data-t="admin.mail.test"></button>
            <button class="btn btn-primary" type="button" id="save-mail-btn" data-t="admin.save"></button>
          </div>
          <p class="note" style="margin:4px 0 0" data-t="admin.mail.saved_when"></p>
        </div>
      </div>
      <p id="test-result" class="note" style="margin-top:10px"></p>
    </section>
    <section class="card" data-keywords="credentials secrets passwords">
      <h2 class="card-title" data-t="admin.secrets.title"></h2>
      <div id="secrets-list" class="stack">
        <p class="note" data-t="admin.loading"></p>
      </div>
      <p class="note" style="margin-top:10px" data-t="admin.secrets.about"></p>
    </section>
    <section class="card stack" id="llm" data-keywords="llm language model ai">
      <div class="section-head">
        <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.llm.title"></h2>
        <span id="llm-in-use" class="note mono"></span>
      </div>
      <p class="note" data-t="admin.llm.about"></p>
      <div class="grid-2">
        <div>
          <label for="llm-mode" data-t="admin.llm.mode"></label>
          <select id="llm-mode">
            <option value="assist" data-t="admin.llm.mode.assist"></option>
            <option value="off" data-t="admin.llm.mode.off"></option>
          </select>
        </div>
        <div>
          <label for="llm-provider" data-t="admin.llm.provider"></label>
          <select id="llm-provider"></select>
        </div>
      </div>
      <div>
        <label for="llm-base" data-t="admin.llm.base"></label>
        <input type="text" id="llm-base" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:1234/v1">
      </div>
      <p id="llm-online" class="note warn" hidden data-t="admin.llm.online"></p>
      <div class="grid-2">
        <div>
          <label for="llm-auth" data-t="admin.llm.auth"></label>
          <select id="llm-auth">
            <option value="none" data-t="admin.llm.auth.none"></option>
            <option value="bearer" data-t="admin.llm.auth.bearer"></option>
            <option value="api_key_header" data-t="admin.llm.auth.header"></option>
          </select>
        </div>
        <div>
          <label for="llm-key" data-t="admin.llm.key"></label>
          <input type="password" id="llm-key" autocomplete="off">
          <label class="row tight" style="margin:4px 0 0 0">
            <input type="checkbox" id="llm-clear-key" style="width:auto">
            <span class="note" data-t="admin.llm.clear_key"></span>
          </label>
        </div>
      </div>
      <div>
        <label for="llm-model" data-t="admin.llm.model"></label>
        <div class="row">
          <input type="text" id="llm-model" class="grow" list="llm-models" spellcheck="false" autocomplete="off" placeholder="google/gemma-4-e4b">
          <datalist id="llm-models"></datalist>
          <button class="btn" type="button" id="llm-load-models" data-t="admin.llm.load_models"></button>
        </div>
      </div>
      <div class="grid-2">
        <div>
          <label for="llm-timeout" data-t="admin.llm.timeout"></label>
          <input type="number" id="llm-timeout" min="5" max="300" value="30">
        </div>
        <div>
          <label for="llm-tokens" data-t="admin.llm.tokens"></label>
          <input type="number" id="llm-tokens" min="50" max="8000" value="400">
        </div>
      </div>
      <label class="row tight" style="margin:0">
        <input type="checkbox" id="llm-no-thinking" style="width:auto" checked>
        <span data-t="admin.llm.no_thinking"></span>
      </label>
      <label class="row tight" style="margin:0">
        <input type="checkbox" id="llm-polish" style="width:auto">
        <span data-t="admin.llm.polish"></span>
      </label>
      <div class="row">
        <button class="btn" type="button" id="llm-test" data-t="admin.test"></button>
        <button class="btn btn-primary" type="button" id="llm-save" data-t="admin.llm.save"></button>
      </div>
      <p id="llm-result" class="note" style="white-space:pre-line"></p>
    </section>
    <section class="card stack" id="network" data-keywords="tls https certificate port proxy archive cidr">
      <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.net.title"></h2>
      <div class="grid-2">
        <div><label for="net-port" data-t="admin.net.port"></label><input type="number" id="net-port" min="1" max="65535"></div>
        <div><label for="net-archive-days" data-t="admin.net.archive_days"></label><input type="number" id="net-archive-days" min="1" max="3650"></div>
      </div>
      <label class="row tight" style="margin:0"><input type="checkbox" id="net-archive" style="width:auto"><span data-t="admin.net.archive"></span></label>
      <label for="net-open" data-t="admin.net.open"></label>
      <textarea id="net-open" rows="3" class="mono"></textarea>
      <p class="note" style="margin:0" data-t="admin.help.cidr"></p>
      <div class="grid-2">
        <div><label for="net-cert" data-t="admin.net.cert"></label><input type="text" id="net-cert" autocomplete="off" spellcheck="false"></div>
        <div><label for="net-certpw" data-t="admin.net.certpw"></label><input type="password" id="net-certpw" autocomplete="new-password"></div>
      </div>
      <label class="row tight" style="margin:0"><input type="checkbox" id="net-trust" style="width:auto"><span data-t="admin.net.trust"></span></label>
      <p class="note" style="margin:0" data-t="admin.help.proxy"></p>
      <label for="net-proxies" data-t="admin.net.proxies"></label>
      <textarea id="net-proxies" rows="2" class="mono"></textarea>
      <label for="net-hosts" data-t="admin.net.hosts"></label>
      <textarea id="net-hosts" rows="2" class="mono"></textarea>
      <button class="btn btn-primary" type="button" id="net-save" data-t="admin.save"></button>
      <p id="net-result" class="note" style="white-space:pre-line"></p>
    </section>

    <section class="card stack" id="operation" data-keywords="repair shadow concurrency downloads encodes poll mail graph folders pacing retry late">
      <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.op.title"></h2>
      <div class="grid-2">
        <div>
          <label for="op-repair" data-t="admin.op.repair"></label>
          <select id="op-repair">
            <option value="off" data-t="admin.op.repair.off"></option>
            <option value="shadow" data-t="admin.op.repair.shadow"></option>
            <option value="hold" data-t="admin.op.repair.hold"></option>
          </select>
        </div>
        <div><label for="op-poll" data-t="admin.op.poll"></label><input type="number" id="op-poll" min="10" max="3600"></div>
      </div>
      <div class="grid-2">
        <div><label for="op-downloads" data-t="admin.op.downloads"></label><input type="number" id="op-downloads" min="1" max="10"></div>
        <div><label for="op-transcodes" data-t="admin.op.transcodes"></label><input type="number" id="op-transcodes" min="1" max="8"></div>
      </div>
      <label class="row tight" style="margin:0"><input type="checkbox" id="op-write" style="width:auto"><span data-t="admin.op.write"></span></label>
      <div class="grid-2">
        <div><label for="op-processed" data-t="admin.op.processed"></label><input type="text" id="op-processed" autocomplete="off"></div>
        <div><label for="op-failed" data-t="admin.op.failed"></label><input type="text" id="op-failed" autocomplete="off"></div>
      </div>
      <div class="grid-2">
        <div><label for="op-host" data-t="admin.op.host"></label><input type="number" id="op-host" min="1" max="4"></div>
        <div><label for="op-gap" data-t="admin.op.gap"></label><input type="number" id="op-gap" min="0" max="120"></div>
      </div>
      <div class="grid-2">
        <div><label for="op-age" data-t="admin.op.age"></label><input type="number" id="op-age" min="30" max="360"></div>
        <div><label for="op-second" data-t="admin.op.second"></label><input type="number" id="op-second" min="30" max="360"></div>
      </div>
      <div class="grid-2">
        <div><label for="op-late" data-t="admin.op.late"></label><input type="number" id="op-late" min="1" max="120"></div>
        <div><label for="op-late-urgent" data-t="admin.op.late_urgent"></label><input type="number" id="op-late-urgent" min="1" max="120"></div>
      </div>
      <button class="btn btn-primary" type="button" id="op-save" data-t="admin.save"></button>
      <p id="op-result" class="note" style="white-space:pre-line"></p>
    </section>
  </div>

  <!-- Άνθρωποι -->
  <div class="admin-section" data-section="people" hidden>
    <section class="card" data-keywords="users accounts roles">
      <div class="section-head" style="margin-bottom:12px">
        <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.users.title"></h2>
        <button class="btn btn-primary" type="button" id="add-user-btn" data-t="admin.users.create"></button>
      </div>
      <div class="card flush">
        <table>
          <thead>
            <tr><th data-t="admin.col.email"></th><th data-t="admin.col.name"></th><th data-t="admin.col.role"></th><th data-t="admin.col.journalist"></th><th data-t="admin.col.status"></th><th class="right" data-t="admin.col.actions"></th></tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="6" class="empty" data-t="admin.loading"></td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <section class="card stack" id="taxonomy" data-keywords="taxonomy journalists groups roster">
      <div class="section-head">
        <h2 class="card-title" style="border:none;margin:0;padding:0" data-t="admin.taxonomy.title"></h2>
        <div class="row tight">
          <button class="btn" type="button" id="taxonomy-export" data-t="admin.taxonomy.export"></button>
          <button class="btn" type="button" id="taxonomy-import-btn" data-t="admin.taxonomy.import"></button>
          <input type="file" id="taxonomy-file" accept="application/json,.json" hidden>
        </div>
      </div>
      <p class="note" data-t="admin.taxonomy.about"></p>
      <label class="row tight" style="margin:0">
        <input type="checkbox" id="taxonomy-replace" style="width:auto">
        <span data-t="admin.taxonomy.replace_label"></span>
      </label>
      <p id="taxonomy-result" class="note" style="white-space:pre-line"></p>

      <h3 class="card-title" style="font-size:0.95rem" data-t="admin.groups.title"></h3>
      <div class="card flush">
        <table>
          <thead>
            <tr><th data-t="admin.groups.col.code"></th><th data-t="admin.col.name"></th><th data-t="admin.groups.col.kind"></th><th data-t="admin.groups.col.keywords"></th><th data-t="admin.groups.col.description"></th><th class="right" data-t="admin.col.actions"></th></tr>
          </thead>
          <tbody id="groups-body">
            <tr><td colspan="6" class="empty" data-t="admin.loading"></td></tr>
          </tbody>
        </table>
      </div>
      <form id="group-form" class="stack">
        <div class="grid-2">
          <div>
            <label for="g-code" data-t="admin.groups.code"></label>
            <input type="text" id="g-code" required maxlength="20" placeholder="NEWS" autocomplete="off">
          </div>
          <div>
            <label for="g-name" data-t="admin.col.name"></label>
            <input type="text" id="g-name" required placeholder="Κεντρικό Δελτίο Ειδήσεων">
          </div>
        </div>
        <div class="grid-2">
          <div>
            <label for="g-kind" data-t="admin.groups.col.kind"></label>
            <select id="g-kind">
              <option value="news" data-t="admin.groups.kind.news"></option>
              <option value="show" selected data-t="admin.groups.kind.show"></option>
              <option value="desk" data-t="admin.groups.kind.desk"></option>
              <option value="other" data-t="admin.groups.kind.other"></option>
            </select>
          </div>
          <div>
            <label for="g-keywords" data-t="admin.groups.keywords"></label>
            <input type="text" id="g-keywords" placeholder="ΔΕΛΤΙΟ, ΚΕΝΤΡΙΚΟ ΔΕΛΤΙΟ">
          </div>
        </div>
        <div>
          <label for="g-description" data-t="admin.groups.description"></label>
          <textarea id="g-description" rows="2" maxlength="500"></textarea>
        </div>
        <button class="btn btn-primary" type="submit" data-t="admin.groups.save"></button>
      </form>

      <h3 class="card-title" style="font-size:0.95rem" data-t="admin.people.title"></h3>
      <div class="card flush" style="max-height:420px;overflow:auto">
        <table>
          <thead>
            <tr><th data-t="admin.people.col.surname"></th><th data-t="admin.col.name"></th><th data-t="admin.people.col.addresses"></th><th data-t="admin.people.col.aliases"></th><th data-t="admin.groups.title"></th><th class="num" data-t="admin.people.col.prio"></th><th class="right"></th></tr>
          </thead>
          <tbody id="people-body">
            <tr><td colspan="7" class="empty" data-t="admin.loading"></td></tr>
          </tbody>
        </table>
      </div>
      <form id="person-form" class="stack">
        <div class="grid-2">
          <div>
            <label for="pf-surname" data-t="admin.people.surname"></label>
            <input type="text" id="pf-surname" required maxlength="40" placeholder="PAPADAKI" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="pf-name" data-t="wizard.account.name"></label>
            <input type="text" id="pf-name" required placeholder="Μαρία Παπαδάκη">
          </div>
        </div>
        <div>
          <label for="pf-emails" data-t="admin.people.emails"></label>
          <input type="text" id="pf-emails" placeholder="m.papadaki@station.gr, papadaki@radio.gr" autocomplete="off" spellcheck="false">
        </div>
        <div>
          <label for="pf-aliases" data-t="admin.people.aliases"></label>
          <input type="text" id="pf-aliases" placeholder="ΠΑΠΑΔΑΚΗ, ΜΑΡΙΑ, ΜΑΙΡΗ">
        </div>
        <div class="grid-2">
          <div>
            <label for="pf-groups" data-t="admin.people.groups"></label>
            <input type="text" id="pf-groups" placeholder="NEWS" autocomplete="off" spellcheck="false">
          </div>
          <div>
            <label for="pf-priority" data-t="admin.people.priority"></label>
            <input type="number" id="pf-priority" value="0" min="-100" max="100">
          </div>
        </div>
        <div class="row">
          <button class="btn btn-primary" type="submit" data-t="admin.people.save"></button>
          <button class="btn" type="button" id="pf-clear" data-t="admin.people.new"></button>
        </div>
      </form>

      <h3 class="card-title" style="font-size:0.95rem" data-t="admin.backups.title"></h3>
      <div class="row" style="justify-content:space-between">
        <p class="note" style="margin:0" data-t="admin.backups.about"></p>
        <button class="btn" type="button" id="taxonomy-backup-now" data-t="admin.backups.now"></button>
      </div>
      <div class="card flush" style="max-height:260px;overflow:auto">
        <table>
          <thead><tr><th data-t="admin.backups.col.backup"></th><th class="num" data-t="admin.groups.title"></th><th class="num" data-t="admin.people.title"></th><th class="right"></th></tr></thead>
          <tbody id="backups-body">
            <tr><td colspan="4" class="empty" data-t="admin.loading"></td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <!-- Ιστότοποι -->
