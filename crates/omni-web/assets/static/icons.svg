<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icon sprite (plan P2.5), replacing the Lucide CDN script.

  Every icon is a 24x24 stroke path referenced as
  `<svg class="icon"><use href="/static/icons.svg#name"></use></svg>`.
  Stroke and width come from `.icon` in app.css, so an icon inherits the
  colour of the text around it.

  Drawn to match the set the panels previously pulled from Lucide (ISC), which
  is why the shapes are familiar; they are redrawn here rather than copied so
  the file has no external provenance to track.
-->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="activity" viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></symbol>

  <symbol id="alert-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v6"/><path d="M12 16h.01"/>
  </symbol>

  <symbol id="alert-triangle" viewBox="0 0 24 24">
    <path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>
    <path d="M12 9v4"/><path d="M12 17h.01"/>
  </symbol>

  <symbol id="archive" viewBox="0 0 24 24">
