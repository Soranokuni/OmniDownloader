[package]
name = "omni-service"
version = "1.0.0"
edition = "2021"

[dependencies]
omni-core = { path = "../omni-core" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_EventLog",
    "Win32_System_Registry",
]
