[package]
name = "omni-setup"
version = "1.0.0"
edition = "2021"
publish = false
description = "OmniIngest-Setup.exe: the release folder in one executable that installs, upgrades and removes OmniIngest"

# Windows "installer detection" runs any unmanifested executable whose name
# contains "setup" elevated (os error 740 without UAC), test harnesses
# included: the library is named without it, and the binary has no tests.
[lib]
name = "omni_deploy"
path = "src/lib.rs"

[[bin]]
name = "OmniIngest-Setup"
path = "src/main.rs"
test = false

[dependencies]
omni-cli = { path = "../omni-cli" }
omni-core = { path = "../omni-core" }
omni-service = { path = "../omni-service" }
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
