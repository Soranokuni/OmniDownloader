[package]
name = "omni-broadcast"
version = "1.0.0"
edition = "2021"

[dependencies]
omni-core = { path = "../omni-core" }
tokio = { version = "1", features = ["full"] }
regex = "1.10"
tracing = "0.1"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
